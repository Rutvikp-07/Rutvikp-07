<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 480" width="340" height="480" role="img" aria-label="Developer working at night" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2238"/><stop offset="1" stop-color="#2b2a40"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a4270"/><stop offset=".6" stop-color="#6d6aa0"/><stop offset="1" stop-color="#d28f8a"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb24d"/><stop offset="1" stop-color="#e2561f"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff9a3c" stop-opacity=".55"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
    <pattern id="blinds" width="10" height="14" patternUnits="userSpaceOnUse"><rect width="10" height="9" fill="#d9e2f2" opacity=".55"/><rect y="9" width="10" height="5" fill="#0b1224" opacity=".35"/></pattern>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2230"/><stop offset="1" stop-color="#16121c"/></linearGradient>
  </defs>

  <rect width="340" height="480" fill="url(#wall)"/>

  <!-- window -->
  <rect x="0" y="0" width="225" height="330" fill="url(#sky)"/>
  <!-- skyline -->
  <g fill="#141a30">
    <rect x="10" y="220" width="34" height="110"/><rect x="48" y="190" width="28" height="140"/><rect x="80" y="235" width="40" height="95"/>
    <rect x="124" y="200" width="30" height="130"/><rect x="158" y="240" width="36" height="90"/><rect x="196" y="215" width="29" height="115"/>
  </g>
  <g fill="#ffd36e">
    <rect x="18" y="232" width="4" height="4"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="56" y="206" width="4" height="4"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="90" y="250" width="4" height="4"><animate attributeName="opacity" values="1;.3;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="132" y="216" width="4" height="4"><animate attributeName="opacity" values=".3;1;.3" dur="3.5s" repeatCount="indefinite"/></rect>
    <rect x="168" y="256" width="4" height="4"><animate attributeName="opacity" values="1;.2;1" dur="4.5s" repeatCount="indefinite"/></rect>
    <rect x="204" y="230" width="4" height="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="0" y="0" width="225" height="330" fill="url(#blinds)"/>
  <rect x="0" y="0" width="225" height="330" fill="none" stroke="#0b1224" stroke-width="6"/>
  <rect x="108" y="0" width="6" height="330" fill="#0b1224"/>

  <!-- lamp-lit glow -->
  <ellipse cx="270" cy="250" rx="120" ry="150" fill="url(#glow)">
    <animate attributeName="opacity" values=".7;1;.7" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- desk -->
  <rect x="90" y="318" width="250" height="14" rx="3" fill="#3b2f2a"/>
  <rect x="110" y="332" width="10" height="110" fill="#2a211e"/>
  <rect x="316" y="332" width="10" height="110" fill="#2a211e"/>

  <!-- monitor -->
  <rect x="236" y="214" width="98" height="74" rx="5" fill="#10131c" stroke="#2b3044" stroke-width="2"/>
  <rect x="242" y="220" width="86" height="62" rx="3" fill="url(#screen)">
    <animate attributeName="opacity" values=".9;1;.85;1;.9" dur="3s" repeatCount="indefinite"/>
  </rect>
  <g fill="#fff3d9" opacity=".85">
    <rect x="249" y="228" width="40" height="4" rx="2"/><rect x="255" y="238" width="58" height="4" rx="2"/>
    <rect x="255" y="248" width="34" height="4" rx="2"/><rect x="249" y="258" width="50" height="4" rx="2"/>
    <rect x="303" y="258" width="4" height="4"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="280" y="288" width="10" height="30" fill="#1b1e2b"/>
  <rect x="266" y="312" width="38" height="6" rx="2" fill="#1b1e2b"/>

  <!-- chair -->
  <rect x="112" y="262" width="82" height="130" rx="26" fill="#161824"/>
  <rect x="150" y="392" width="8" height="52" fill="#161824"/>
  <ellipse cx="154" cy="448" rx="46" ry="8" fill="#161824"/>

  <!-- person (from behind) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1.5;0,0" dur="3s" repeatCount="indefinite"/>
    <path d="M118 340 q-4 -58 36 -62 q40 4 36 62 z" fill="#c8d0e2"/>
    <path d="M190 300 q34 6 56 -12 l6 12 q-30 22 -62 16 z" fill="#c8d0e2"/>
    <circle cx="154" cy="248" r="27" fill="#241912"/>
    <path d="M127 246 q4 -34 28 -34 q26 0 28 34 q-14 -16 -28 -16 q-14 0 -28 16 z" fill="#0f0b08"/>
    <rect x="144" y="268" width="20" height="14" fill="#b88566"/>
    <circle cx="214" cy="248" r="0" fill="none"/>
  </g>
  <!-- rim light on person -->
  <path d="M184 250 q10 20 4 52" stroke="#ff9a3c" stroke-width="3" fill="none" opacity=".6" stroke-linecap="round">
    <animate attributeName="opacity" values=".4;.8;.4" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- floor -->
  <rect x="0" y="440" width="340" height="40" fill="url(#floor)"/>

  <!-- plant -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1.5 40 420;1.5 40 420;-1.5 40 420" dur="6s" repeatCount="indefinite"/>
    <path d="M40 420 q-30 -40 -22 -80 q22 20 22 80z" fill="#2f6b4a"/>
    <path d="M40 420 q0 -60 20 -90 q10 40 -20 90z" fill="#3f8a5f"/>
    <path d="M40 420 q34 -30 40 -70 q-30 14 -40 70z" fill="#2f6b4a"/>
  </g>
  <path d="M22 420 h36 l-5 40 h-26 z" fill="#8a5a3c"/>

  <!-- dust -->
  <g fill="#ffe2b0">
    <circle cx="250" cy="170" r="1.5"><animate attributeName="cy" values="190;140" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="190" r="1.5"><animate attributeName="cy" values="200;150" dur="7s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="7s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="200" r="1.5"><animate attributeName="cy" values="210;160" dur="5s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="5s" begin="2s" repeatCount="indefinite"/></circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
