<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Rutvik Parit banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/><stop offset=".55" stop-color="#101c34"/><stop offset="1" stop-color="#0b1424"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd0ff" stop-opacity="0"/><stop offset=".5" stop-color="#cfe6ff" stop-opacity=".22"/><stop offset="1" stop-color="#9fd0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bcd6ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C4FF" stop-opacity="0"/><stop offset="1" stop-color="#00C4FF"/>
    </linearGradient>
    <clipPath id="reveal"><rect x="1240" y="80" height="120" width="0">
      <animate attributeName="x" dur="9s" repeatCount="indefinite" keyTimes="0;0.12;0.88;1" values="1240;480;480;1240"/>
      <animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.12;0.88;1" values="0;760;760;0"/>
    </rect></clipPath>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>

  <!-- light beams -->
  <polygon points="120,0 330,0 760,300 520,300" fill="url(#beam)">
    <animate attributeName="opacity" values=".5;1;.5" dur="5s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="380,0 470,0 820,300 730,300" fill="url(#beam)" opacity=".6">
    <animate attributeName="opacity" values=".3;.8;.3" dur="7s" repeatCount="indefinite"/>
  </polygon>

  <!-- speech bubble -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="4s" repeatCount="indefinite"/>
    <path d="M70 40 q0 -26 40 -26 h110 q40 0 40 26 q0 26 -40 26 h-60 l-26 22 l4 -22 h-28 q-40 0 -40 -26z" fill="#18233f" stroke="#8fa8cc" stroke-width="2"/>
    <text x="165" y="49" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#00C4FF">&lt;/&gt;  hi!</text>
  </g>

  <!-- floating code windows -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="6s" repeatCount="indefinite"/>
    <rect x="130" y="120" width="230" height="130" rx="10" fill="#0d1526" stroke="#2a3b5e" stroke-width="2"/>
    <circle cx="150" cy="138" r="5" fill="#ff5f57"/><circle cx="168" cy="138" r="5" fill="#febc2e"/><circle cx="186" cy="138" r="5" fill="#28c840"/>
    <rect x="150" y="160" width="110" height="8" rx="4" fill="#00C4FF" opacity=".8"/>
    <rect x="166" y="178" width="150" height="8" rx="4" fill="#6f8fd0"/>
    <rect x="166" y="196" width="90" height="8" rx="4" fill="#8f7ae6"/>
    <rect x="150" y="214" width="130" height="8" rx="4" fill="#5ee0b0"/>
    <rect x="290" y="214" width="8" height="8" fill="#ffffff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="5s" repeatCount="indefinite"/>
    <rect x="400" y="150" width="190" height="110" rx="10" fill="#0d1526" stroke="#2a3b5e" stroke-width="2"/>
    <rect x="418" y="172" width="70" height="8" rx="4" fill="#EA4B71"/>
    <rect x="418" y="190" width="140" height="8" rx="4" fill="#6f8fd0"/>
    <rect x="418" y="208" width="100" height="8" rx="4" fill="#00C4FF"/>
    <rect x="418" y="226" width="120" height="8" rx="4" fill="#5ee0b0"/>
  </g>

  <!-- floating dots -->
  <g fill="#cfe6ff">
    <circle cx="640" cy="60" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="250" r="2"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="230" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.5s" begin=".5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <g clip-path="url(#reveal)">
    <text x="1230" y="170" text-anchor="end" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-size="88" font-weight="900" letter-spacing="3" fill="url(#txt)">RUTVIK PARIT</text>
  </g>

  <rect x="800" y="188" width="430" height="3" fill="url(#accent)">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.15;0.88;1" values="0;1;1;0"/>
  </rect>

  <text x="1230" y="226" text-anchor="end" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-size="17" letter-spacing="2" fill="#9fb4d0">
    Full Stack Developer | AI Automation | React + Supabase | n8n | OCR
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.15;0.25;0.88;1" values="0;0;1;1;0"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
